<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <h1 class="text-center font-bold">Photography Exhibit<h1>
    <div class="main-container grid grid-cols-3 gap-2">
      <div class="card rounded-sm p-2">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="Colosseo" class="rounded-sm" />
        <h2 class="subheading text-base font-bold">Colosseum</h2>
        <p class="description text-sm">There is so much history and beauty. The light hits it just right.</p>
      </div>
      <div class="card rounded-sm p-2">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="alps" class="rounded-sm" />
        <h2 class="subheading text-base font-bold">The Alps</h2>
        <p class="description text-sm">The mountains go on forever and the view is breathtaking.</p>
      </div>
      <div class="card rounded-sm p-2">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="sea" class="rounded-sm" />
        <h2 class="subheading text-base font-bold">Seascape</h2>
        <p class="description text-sm">The water was still, the air was cool and the feeling is pure peace.</p>
      </div>
      </div> 
  </body>
</html>
